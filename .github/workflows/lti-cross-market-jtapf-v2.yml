name: LTI cross-market JTAPF v2

on:
  workflow_dispatch:
  push:
    branches:
      - research/lti-cross-market-jtapf-20260806

concurrency:
  group: lti-cross-market-jtapf-v2
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cross-market-study:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore and patch the preregistered research script
        shell: bash
        run: |
          mkdir -p research/lti_cross_market_jtapf
          curl --fail --location --retry 5 \
            https://raw.githubusercontent.com/yhlai0911/aga_capital/c4af07fa48058d0d2fb077d22390be168ad8e3a4/.github/workflows/lti-cross-market-jtapf.yml \
            --output /tmp/source-workflow.yml
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, re

          text = Path('/tmp/source-workflow.yml').read_text(encoding='utf-8')
          match = re.search(r"cat > /tmp/lti_script\.b64 <<'B64'\n(.*?)\n\s*B64", text, re.S)
          if match is None:
              raise RuntimeError('embedded script payload not found')
          payload = ''.join(line.strip() for line in match.group(1).splitlines())
          script = gzip.decompress(base64.b64decode(payload)).decode('utf-8')
          old = '''    # Signal at t-1 can be implemented on t only when the asset is observed/tradable.\n    position = np.zeros(len(true_lp))\n    for t in range(max(train_end, 1), len(true_lp)):\n        if observed[t]:\n            position[t] = desired[t - 1]\n        else:\n            position[t] = position[t - 1]\n'''
          new = '''    # The close-to-close return at t can only use information known at t-1.\n    # A position change is therefore allowed only when t-1 had an observable\n    # synthetic trade; using observed[t] here would leak same-day availability.\n    position = np.zeros(len(true_lp))\n    for t in range(max(train_end, 1), len(true_lp)):\n        if observed[t - 1]:\n            position[t] = desired[t - 1]\n        else:\n            position[t] = position[t - 1]\n'''
          if old not in script:
              raise RuntimeError('expected trading-timing block not found')
          script = script.replace(old, new)
          path = Path('research/lti_cross_market_jtapf/run_cross_market_jtapf.py')
          path.write_text(script, encoding='utf-8')
          PY
          python -m py_compile research/lti_cross_market_jtapf/run_cross_market_jtapf.py

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run cross-market experiment
        env:
          LTI_OUTPUT: results
          LTI_START: "2012-01-01"
          LTI_END: "2026-08-07"
          LTI_TRAIN_FRAC: "0.60"
          LTI_RATES: "0.10,0.20,0.40"
          LTI_MECHANISMS: "selection,threshold,mixed"
          LTI_REPS: "2"
          LTI_PARTICLES: "160"
          LTI_MIN_OBS: "1700"
          LTI_MAX_PER_MARKET: "12"
          LTI_SEED: "20260806"
        run: python research/lti_cross_market_jtapf/run_cross_market_jtapf.py

      - name: Create reproducibility bundle
        if: always()
        shell: bash
        run: |
          mkdir -p bundle
          cp -r results bundle/results 2>/dev/null || true
          cp research/lti_cross_market_jtapf/run_cross_market_jtapf.py bundle/ 2>/dev/null || true
          cp .github/workflows/lti-cross-market-jtapf-v2.yml bundle/
          cp requirements.txt bundle/
          python - <<'PY'
          from pathlib import Path
          import hashlib
          root = Path('bundle')
          rows = []
          for path in sorted(root.rglob('*')):
              if path.is_file():
                  rows.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.relative_to(root)}")
          (root / 'SHA256SUMS').write_text('\n'.join(rows) + '\n', encoding='utf-8')
          PY
          zip -qr lti-cross-market-jtapf-v2-results.zip bundle

      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lti-cross-market-jtapf-v2-results
          path: |
            lti-cross-market-jtapf-v2-results.zip
            results/
          if-no-files-found: warn
          retention-days: 14
