name: LTI cross-market JTAPF

on:
  workflow_dispatch:
  push:
    branches:
      - research/lti-cross-market-jtapf-20260806

permissions:
  contents: read

jobs:
  cross-market-study:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore research script
        shell: bash
        run: |
          mkdir -p research/lti_cross_market_jtapf
          cat > /tmp/lti_script.b64 <<'B64'
          
          B64
          base64 --decode /tmp/lti_script.b64 | gzip --decompress > research/lti_cross_market_jtapf/run_cross_market_jtapf.py
          python -m py_compile research/lti_cross_market_jtapf/run_cross_market_jtapf.py

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy matplotlib yfinance pyarrow

      - name: Run cross-market experiment
        env:
          LTI_OUTPUT: results
          LTI_START: "2012-01-01"
          LTI_END: "2026-08-07"
          LTI_TRAIN_FRAC: "0.60"
          LTI_RATES: "0.10,0.20,0.40"
          LTI_MECHANISMS: "selection,threshold,mixed"
          LTI_REPS: "2"
          LTI_PARTICLES: "160"
          LTI_MIN_OBS: "1700"
          LTI_MAX_PER_MARKET: "12"
          LTI_SEED: "20260806"
        run: python research/lti_cross_market_jtapf/run_cross_market_jtapf.py

      - name: Create reproducibility bundle
        if: always()
        shell: bash
        run: |
          mkdir -p bundle
          cp -r results bundle/results 2>/dev/null || true
          cp research/lti_cross_market_jtapf/run_cross_market_jtapf.py bundle/
          cp .github/workflows/lti-cross-market-jtapf.yml bundle/
          python - <<'PY'
          from pathlib import Path
          import hashlib
          root = Path('bundle')
          rows=[]
          for p in sorted(root.rglob('*')):
              if p.is_file():
                  rows.append(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(root)}")
          (root/'SHA256SUMS').write_text('\n'.join(rows)+'\n')
          PY
          zip -qr lti-cross-market-jtapf-results.zip bundle

      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lti-cross-market-jtapf-results
          path: |
            lti-cross-market-jtapf-results.zip
            results/
          if-no-files-found: warn
          retention-days: 14
